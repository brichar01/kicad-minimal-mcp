[project]
name = "kicad-minimal-mcp"
version = "0.1.0"
description = "Minimal MCP server for creating KiCad footprints and footprint libraries"
readme = "README.md"
authors = [
    { name = "Ben Richards", email = "bdvrichards@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kicad-python>=0.9.0.dev0",
    "mcp[cli]>=2.3,<3",
    "shapely>=2.2.0",
]

[project.scripts]
kicad-minimal-mcp = "kicad_minimal_mcp:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
kicad-python = { path = "../kicad-python", editable = true }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises the MCP server against recorded KiCad IPC fixtures",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
